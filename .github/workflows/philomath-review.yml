name: 'Philomath AI REVIEWER'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      review_scope:
        description: "commit or pr"
        required: false
        default: "commit"
      exercise_id:
        description: "exercise id"
        required: false
        default: "ex-XXX" # <-- Change to your exercise ID

jobs:
  run-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate exercise ID
        if: github.event_name == 'workflow_dispatch'
        run: |
          ID="${{ inputs.exercise_id }}"
          if [[ ! "$ID" =~ ^ex-[0-9]{3}$ ]]; then
            echo "::error::Invalid exercise_id '$ID' — expected format: ex-NNN (e.g. ex-006)"
            exit 1
          fi

      - name: Checkout Student Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Philomath Engine
        uses: actions/checkout@v4
        with:
          repository: Philomath-Academy/code-review-engine
          ref: main
          token: ${{ secrets.CORE_TOKEN }}
          path: .philomath-engine

      - name: Run Philomath Review
        uses: ./.philomath-engine
        with:
          exercise_id: ${{ inputs.exercise_id || 'ex-004' }} # <-- Change to your exercise ID
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          core_token: ${{ secrets.CORE_TOKEN }}
        env:
          LLM_PROVIDER: anthropic
          REVIEW_SCOPE: ${{ inputs.review_scope || (github.event.action == 'synchronize' && 'commit' || 'pr') }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MAX_TOKEN_BUDGET: '20000'
